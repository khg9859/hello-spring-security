<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 거부 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .error-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .error-code { font-size: 4rem; font-weight: 800; color: #e94560; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card error-card text-center p-5" style="max-width: 480px;">
        <div class="error-code mb-2">403</div>
        <h4 class="fw-bold mb-2">접근이 거부되었습니다</h4>
        <p class="text-muted mb-4">이 기능은 관리자(ADMIN)만 사용할 수 있습니다.</p>
        <a th:href="@{/home}" class="btn btn-primary px-4">홈으로</a>
        <a th:href="@{/products}" class="btn btn-outline-secondary px-4 ms-2">상품 목록</a>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
